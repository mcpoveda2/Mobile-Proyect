<ion-content [fullscreen]="true" class="tab2-content">
  <div class="header-container">
    <h1 class="title">Add entry</h1>
  </div>

  <div class="form-container">
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="form-label">Title</label>
        <ion-input
          [(ngModel)]="formData.title"
          name="title"
          placeholder="Enter a title"
        ></ion-input>
      </div>

      <div class="form-group">
        <label class="form-label">Place</label>
        <ion-input
          [(ngModel)]="formData.place"
          name="place"
          placeholder="Enter a place"
        ></ion-input>
      </div>

      <!-- Weather section -->
      <div class="form-group">
        <label class="form-label">Weather</label>
        <div class="weather-container">
          <div
            *ngFor="let condition of weatherOptions"
            class="weather-button"
            [class.active]="formData.weather.includes(condition)"
            (click)="toggleWeather(condition)"
          >
            {{ condition }}
          </div>
        </div>
      </div>

      <!-- Editable text area -->
      <div class="form-group">
        <label class="form-label">Write about your day</label>
        <div class="day-textarea-container">
          <textarea
            [(ngModel)]="formData.dayDescription"
            name="dayDescription"
            placeholder="Write about your day..."
            class="day-textarea"
          ></textarea>
        </div>
      </div>
      
      <div class="form-group">
        <label class="form-label">Upload Picture</label>
        <ion-button expand="block" (click)="selectImage()" color="secondary">
          Select Image
        </ion-button>
        <div *ngIf="formData.imagePath" class="image-preview">
          <img [src]="formData.imagePath" alt="Selected Image" />
        </div>
      </div>

      <ion-button expand="block" type="submit" color="primary">Save</ion-button>
    </form>
  </div>
</ion-content>
