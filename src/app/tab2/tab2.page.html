<ion-content [fullscreen]="true" class="tab2-content">
  <!-- Header -->
  <div class="header-container">
    <h1 class="title">Add Entry</h1>
  </div>

  <!-- Formulario -->
  <div class="form-container">
    <form (ngSubmit)="onSubmit()">
      <!-- Campo: Título -->
      <div class="form-group">
        <label class="form-label">Title</label>
        <ion-input
          [(ngModel)]="formData.title"
          name="title"
          placeholder="Enter a title"
          required
        ></ion-input>
      </div>

      <!-- Campo: Lugar -->
      <div class="form-group">
        <label class="form-label">Place</label>
        <ion-input
          [(ngModel)]="formData.place"
          name="place"
          placeholder="Enter a place"
          required
        ></ion-input>
      </div>

      <!-- Campo: Fecha -->
      <div class="form-group">
        <label class="form-label">Date</label>
        <ion-datetime
          [(ngModel)]="formData.date"
          name="date"
          placeholder="Select a date"
          presentation="date"
          (ionChange)="onDateChange($event)"
        ></ion-datetime>
      </div>

      <!-- Sección: Clima -->
      <div class="form-group">
        <label class="form-label">Weather</label>
        <div class="weather-container">
          <ion-chip
            *ngFor="let condition of weatherOptions"
            [color]="formData.weather.includes(condition) ? 'primary' : 'medium'"
            (click)="toggleWeather(condition)"
          >
            {{ condition }}
          </ion-chip>
        </div>
      </div>

      <!-- Campo: Descripción -->
      <div class="form-group">
        <label class="form-label">Write about your day</label>
        <ion-textarea
          [(ngModel)]="formData.dayDescription"
          name="dayDescription"
          placeholder="Write about your day..."
          auto-grow="true"
        ></ion-textarea>
      </div>

      <!-- Subir Imágenes -->
      <div class="form-group">
        <label class="form-label">Upload Pictures</label>
        <ion-button expand="block" (click)="selectImage()" color="secondary">
          Select Images
        </ion-button>

        <!-- Vista previa de imágenes -->
        <div class="image-preview-list">
          <ion-img
            *ngFor="let imagePath of formData.imagePaths"
            [src]="imagePath"
            class="image-preview"
          ></ion-img>
        </div>
      </div>

      <!-- Botón: Guardar -->
      <ion-button expand="block" type="submit" color="primary">Save</ion-button>
    </form>
  </div>
</ion-content>
