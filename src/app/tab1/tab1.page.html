<ion-content [fullscreen]="true" class="tab1-content">
  <!-- Contenedor del encabezado -->
  <div class="header-container">
    <div class="text-container">
      <h1>
        <span class="greeting">Hi <strong>{{ userName }},</strong></span>
        <br />
        <span class="subtext">today can be a good day</span>
      </h1>
      <div class="underline"></div>
    </div>
    <ion-avatar class="profile-avatar">
      <img [src]="profilePicture" alt="Profile Picture" />
    </ion-avatar>
  </div>

  <!-- Sección de 'Recent Entries' -->
  <div class="recent-entries-header">
    <h2 class="text-recent">Recent entries</h2>
    <ion-select placeholder="Sort by" class="sort-select" (ionChange)="sortEntries($event)">
      <ion-select-option *ngFor="let sortOption of sortOptions" [value]="sortOption.value">
        {{ sortOption.label }}
      </ion-select-option>
    </ion-select>
  </div>

  <!-- Tarjetas dinámicas -->
  <div class="sectionInformation">
    <ion-card *ngFor="let card of sortedCards">
      <!-- Etiquetas sobre la tarjeta -->
      <ion-card-header>
        <ion-card-title>{{ card.title }}</ion-card-title>
        <ion-card-subtitle>{{ card.date }} | {{ card.place }}</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <p>{{ card.dayDescription }}</p>
      </ion-card-content>
      <div class="weather-tags">
        <ion-chip *ngFor="let weather of card.weather" class="tags-category">{{ weather }}</ion-chip>
      </div>
    </ion-card>
  </div>
</ion-content>
