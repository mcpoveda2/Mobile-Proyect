<ion-header>
  <ion-toolbar>
    <ion-title>DearDiary</ion-title>
  </ion-toolbar>
</ion-header>

<ion-tabs>
  <!-- Tab Bar -->
  <ion-tab-bar slot="bottom" class="custom-tab-bar">
    <!-- Tab 1 -->
    <ion-tab-button tab="tab1" href="/tabs/tab1">
      <ion-icon aria-hidden="true" name="home-outline"></ion-icon>
      <ion-label>Inicio</ion-label>
    </ion-tab-button>

    <!-- Tab 3 -->
    <ion-tab-button tab="tab3" href="/tabs/tab3">
      <ion-icon aria-hidden="true" name="person-outline"></ion-icon>
      <ion-label>Perfil</ion-label>
    </ion-tab-button>
    <!-- Tab 4 -->
    <ion-tab-button tab="tab4" href="/tabs/tab4">
      <ion-icon name="person-outline"></ion-icon>
      <ion-label>Calculadora Emociones</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
  


</ion-tabs>

<!-- Floating Action Button (FAB) -->
<div class="fab-container">
  <ion-fab vertical="bottom" horizontal="center" slot="fixed">
    <ion-fab-button (click)="navigateToTab2()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</div>
